title: soma0sd 깃허브 페이지
# tagline 은 <title> 뒤에 붙는 짧은 꼬리말, description 은 검색 결과용 설명이다.
tagline: GitHub 프로필·언어 통계·저장소
description: soma0sd 의 GitHub 프로필, 언어 사용량 통계, 공개 저장소 목록을 한 화면에 정리한 페이지입니다.
author: soma0sd
email: soma0sd@gmail.com
url: "https://soma0sd.github.io/"
lang: ko

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-github-metadata

# 프로필 표시 값.
# GitHub 계정에 없는 항목(한국어 이름)이나 비어 있는 항목(company)을 여기서 채운다.
# 빈 문자열이면 해당 줄을 렌더하지 않는다.
profile:
  name_ko: "진승완"
  # bio 를 빈 문자열로 두면 소개 줄을 표시하지 않는다.
  # 키 자체를 지우면 GitHub 계정의 bio 가 다시 나온다.
  bio: ""
  company: "하늘소프트"
  position: "차장"
  company_url: ""

sass:
  style: compressed

# 빌드 산출물이 아닌 원본·설정 파일이 공개 사이트로 복사되지 않게 한다.
# (`exclude` 를 지정하면 Jekyll 기본값을 덮어쓰므로 기본 항목도 함께 적는다.)
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - package.json
  - package-lock.json
  - tsconfig.json
  - python/
  - README.md
  - CLAUDE.md
  - task.md

# jekyll-seo-tag 플러그인
webmaster_verifications:
  google: XyHLbga2Eq2JzK-hhFHlpl5XQHWqc8jDEZV5hczQ7J0
  bing: 55B06ED5B745AF3AC11DE920FEC21E9D
locale: ko_KR
