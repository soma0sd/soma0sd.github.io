name: Bundle security update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Resolve latest allowed gem versions
        run: |
          gem install bundler
          bundle lock --update

      - name: Report resolved versions
        run: |
          echo "### Resolved versions" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^    (github-pages|jekyll|nokogiri|activesupport|faraday|rexml|tzinfo|addressable|commonmarker|concurrent-ruby|kramdown) \(' Gemfile.lock >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git diff --cached --quiet && echo "No lockfile change" && exit 0
          git commit -m "chore(deps): resolve Gemfile.lock to patched gem versions"
          git push
